name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-typescript:
    name: TypeScript Build & Smoke Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build 01-sqlite-notes-server
        run: |
          cd examples/01-sqlite-notes-server
          npm install
          npm run build

      - name: Build 03-filesystem-sandbox-server
        run: |
          cd examples/03-filesystem-sandbox-server
          npm install
          npm run build

      - name: Build tools/mcp-cli-runner
        run: |
          cd tools/mcp-cli-runner
          npm install
          npm run build

      - name: End-to-End CLI Smoke Test (Notes Server)
        run: |
          cd tools/mcp-cli-runner
          # Verify list-tools handshake and tools discovery
          node dist/index.js --command node --args "../../examples/01-sqlite-notes-server/dist/index.js" list-tools
          # Verify tool call execution
          node dist/index.js --command node --args "../../examples/01-sqlite-notes-server/dist/index.js" call-tool create_note '{"title":"CI Test","content":"Smoke test in GitHub Actions"}'
          node dist/index.js --command node --args "../../examples/01-sqlite-notes-server/dist/index.js" call-tool list_all_notes
          node dist/index.js --command node --args "../../examples/01-sqlite-notes-server/dist/index.js" read-resource sqlite://notes/schema

  validate-python-examples:
    name: Python FastMCP Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Syntax Check Weather & Currency Server
        run: |
          cd examples/02-python-weather-currency-server
          uv run python -m py_compile server.py

      - name: Syntax Check JSONPlaceholder Server
        run: |
          cd examples/04-json-rest-api-mock-server
          uv run python -m py_compile server.py

  verify-docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Services
        run: docker compose build
